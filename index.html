<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة خمّن الكلمة | Guess the Word</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .hint-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #c7d2fe;
            font-size: 1.05rem;
        }

        .word-display {
            font-size: 2.5rem;
            letter-spacing: 12px;
            font-weight: bold;
            margin: 30px 0;
            color: var(--text-main);
            direction: ltr;
            unicode-bidi: embed;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .keyboard {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .key-btn {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .key-btn:hover:not(:disabled) {
            background-color: var(--primary);
            transform: translateY(-2px);
        }

        .key-btn:disabled {
            background-color: #1e293b;
            color: #475569;
            cursor: not-allowed;
            border: 1px solid #334155;
        }

        .message-box {
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 30px;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        /* نافذة النهاية */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
        }

        .modal h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .modal p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>لعبة خمّن الكلمة 🎮</h1>
            <p>تحدي كلمات الإنجليزية الخاصة بك</p>
        </header>

        <div class="stats-bar">
            <span>الكلمة: <strong id="current-word-num">1</strong> / 15</span>
            <span>المحاولات المتبقية: <strong id="attempts-left" style="color: var(--success);">6</strong></span>
        </div>

        <div class="hint-box" id="hint-text">
            جاري تحميل التلميح...
        </div>

        <div class="word-display" id="word-display">
            _ _ _ _ _
        </div>

        <div class="message-box" id="game-message"></div>

        <div class="keyboard" id="keyboard">
            <!-- سيتم توليد أزرار الكيبورد عبر الجافاسكريبت -->
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="resetGame()">إعادة اللعبة</button>
        </div>

        <!-- شاشة الفوز/النهاية -->
        <div class="modal" id="end-modal">
            <h2 id="modal-title">🎉 مبروك أتممتِ اللعبة!</h2>
            <p id="modal-desc">لقد اجتزتِ جميع الكلمات بنجاح.</p>
            <button class="btn" onclick="restartEntireGame()">لعب مرة أخرى</button>
        </div>
    </div>

    <script>
        const wordsList = [
            { word: "benefit", hint: "فائدة / منفعة" },
            { word: "clue", hint: "دليل / إشارة" },
            { word: "positive", hint: "إيجابي" },
            { word: "prize", hint: "جائزة" },
            { word: "react", hint: "يتفاعل / يستجيب" },
            { word: "useful", hint: "مفيد" },
            { word: "team building", hint: "بناء الفريق (مكونة من كلمتين، اترك مسافة)" },
            { word: "stressful", hint: "مُجهد / ضاغط أعصاب" },
            { word: "reward", hint: "مكافأة" },
            { word: "problem solving", hint: "حل المشكلات (مكونة من كلمتين)" },
            { word: "object", hint: "شيء / غرض / كائن" },
            { word: "comparative", hint: "مقارنة / نسبي" },
            { word: "cooperative", hint: "متعاون / تعاوني" },
            { word: "developer", hint: "مُطوّر (برمجيات مثلاً)" },
            { word: "entertainment", hint: "ترفيه / تسلية" }
        ];

        let currentIndex = 0;
        let selectedData = {};
        let guessedLetters = [];
        let attemptsLeft = 6;
        let score = 0;

        const wordDisplay = document.getElementById("word-display");
        const hintText = document.getElementById("hint-text");
        const attemptsEl = document.getElementById("attempts-left");
        const currentWordNumEl = document.getElementById("current-word-num");
        const gameMessage = document.getElementById("game-message");
        const keyboardEl = document.getElementById("keyboard");
        const endModal = document.getElementById("end-modal");
        const modalTitle = document.getElementById("modal-title");
        const modalDesc = document.getElementById("modal-desc");

        function initGame() {
            if (currentIndex >= wordsList.length) {
                showEndScreen();
                return;
            }

            selectedData = wordsList[currentIndex];
            guessedLetters = [];
            attemptsLeft = 6;
            
            currentWordNumEl.innerText = currentIndex + 1;
            attemptsEl.innerText = attemptsLeft;
            attemptsEl.style.color = "var(--success)";
            hintText.innerText = `💡 المعنى / التلميح: ${selectedData.hint}`;
            gameMessage.innerText = "";

            updateWordDisplay();
            createKeyboard();
        }

        function updateWordDisplay() {
            let displayString = "";
            let solved = true;

            for (let char of selectedData.word) {
                if (char === " ") {
                    displayString += " &nbsp; ";
                } else if (guessedLetters.includes(char)) {
                    displayString += char + " ";
                } else {
                    displayString += "_ ";
                    solved = false;
                }
            }

            wordDisplay.innerHTML = displayString;

            if (solved) {
                gameMessage.style.color = "var(--success)";
                gameMessage.innerText = "✨ أحسنتِ! انتقار للكلمة التالية...";
                score++;
                disableAllKeys();
                setTimeout(() => {
                    currentIndex++;
                    initGame();
                }, 1500);
            }
        }

        function createKeyboard() {
            keyboardEl.innerHTML = "";
            const alphabet = "abcdefghijklmnopqrstuvwxyz";

            for (let letter of alphabet) {
                const btn = document.createElement("button");
                btn.classList.add("key-btn");
                btn.innerText = letter.toUpperCase();
                btn.onclick = () => handleGuess(letter, btn);
                keyboardEl.appendChild(btn);
            }
        }

        function handleGuess(letter, btn) {
            btn.disabled = true;
            guessedLetters.push(letter);

            if (selectedData.word.includes(letter)) {
                btn.style.backgroundColor = "var(--success)";
                updateWordDisplay();
            } else {
                attemptsLeft--;
                attemptsEl.innerText = attemptsLeft;
                if (attemptsLeft <= 2) {
                    attemptsEl.style.color = "var(--danger)";
                }
                
                if (attemptsLeft === 0) {
                    gameMessage.style.color = "var(--danger)";
                    gameMessage.innerText = `❌ انتهت المحاولات! الكلمة كانت: ${selectedData.word}`;
                    disableAllKeys();
                    setTimeout(() => {
                        currentIndex++;
                        initGame();
                    }, 2500);
                }
            }
        }

        function disableAllKeys() {
            const buttons = keyboardEl.querySelectorAll("button");
            buttons.forEach(btn => btn.disabled = true);
        }

        function showEndScreen() {
            endModal.style.display = "flex";
            modalTitle.innerText = "🏆 تهانينا! أنهيتِ التحدي";
            modalDesc.innerText = `لقد أجبتِ على الكلمات بنجاح.`;
        }

        function resetGame() {
            currentIndex = 0;
            score = 0;
            endModal.style.display = "none";
            initGame();
        }

        function restartEntireGame() {
            resetGame();
        }

        // بدء اللعبة لأول مرة
        initGame();
    </script>
</body>
</html>
